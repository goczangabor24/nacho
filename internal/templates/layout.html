{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c0009">
  <meta name="color-scheme" content="dark">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob one"></span>
    <span class="blob two"></span>
    <span class="blob three"></span>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">N</span>
      <span class="brand-text">
        <span class="brand-name">Nacho</span>
        <span class="brand-tag">Drink stock</span>
      </span>
    </div>
  </header>

  <main class="stage">
    <section class="card">
      {{template "content" .}}
    </section>
  </main>

  <footer class="site-footer">Private &middot; family use only</footer>
</body>
</html>
{{end}}
